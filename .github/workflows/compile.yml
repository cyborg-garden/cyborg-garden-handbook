name: compile

# Two jobs with different jobs to do.
#
# `check` runs on every push and pull request. It compiles the handbook from the
# committed snapshot, touches no network, and fails if any page in pages/ does not
# match its sources. That catches the one mistake this repository is most likely to
# suffer: someone editing a generated page by hand and losing the edit on the next
# compile. It needs no credentials, so it runs on pull requests from forks.
#
# `refresh` runs weekly and on demand. It asks GitHub what each listed repository
# currently says about itself, recompiles, and commits the result if anything moved.
# That is what makes the handbook auto-updating: a repository that rewrites its own
# description shows up here without anyone opening an editor.
#
# The privacy invariant lives in bin/compile.mjs and runs in both jobs. A record
# whose live visibility is not PUBLIC aborts the run before a file is written.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday morning UTC.
    - cron: '19 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the compiled pages match their sources
        run: node bin/compile.mjs --check

  refresh:
    # Only the scheduled and manual runs refresh; a push must not rewrite itself.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recompile from GitHub
        env:
          # The default token is enough: every repository the handbook lists is
          # public, and the compile fails loudly if one of them ever is not.
          GH_TOKEN: ${{ github.token }}
        run: node bin/compile.mjs
      - name: Commit any change
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing moved"
            exit 0
          fi
          git config user.name  "handbook-bot"
          git config user.email "handbook-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(handbook): refresh from public sources"
          git push
